<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Mask abstract">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0E0F0"/>
      <stop offset="40%" stop-color="#E0D0F0"/>
      <stop offset="100%" stop-color="#F5D8E0"/>
    </linearGradient>
    <radialGradient id="bloom1" cx="30%" cy="40%" r="35%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D8B8E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloom2" cx="70%" cy="55%" r="35%">
