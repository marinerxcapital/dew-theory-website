<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><title>Product</title></head>
<body>
  <h1 data-testid="product-name">Green Tea Citrus Cleanser</h1>
  <p data-testid="product-sku">SS-GREEN_TEA_CITRUS_CLEANSER</p>
  <p data-testid="product-size">6 oz</p>
  <p data-testid="product-price">$16.00</p>
  <p data-testid="product-stock" id="stock">In Stock</p>
  <button data-testid="add-to-cart">Add to Cart</button>
  <script>
    const sku = location.pathname.split('/').pop();
    document.querySelector('[data-testid="product-sku"]').textContent = sku;
    if (window.SCENARIO === 'oos') document.getElementById('stock').textContent = 'Out of Stock';
    if (window.SCENARIO === 'price_drift') document.querySelector('[data-testid="product-price"]').textContent = '$99.00';
  </script>
</body>
</html>
