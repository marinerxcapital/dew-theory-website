# Dew Theory Skin Script RPA — Fly.io deploy template
# Requires: fly auth login (MarinerX / Dew Theory org — not CertaMaris)
# Secrets: fly secrets set HMAC_SECRET=... USERNAME=... PASSWORD=... (see ENV.md)

app = "dew-theory-skin-script-rpa"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[env]
  PORTAL_BASE_URL = "https://skinscript.com"
  LOGIN_URL = "https://skinscriptrx.com/my-account/"
  EXPECTED_ACCOUNT_NAME = "Emily"
  DRY_RUN = "true"
  RPA_ENABLED = "true"
  MOCK_PORTAL = "false"
  SKIN_SCRIPT_PORTAL_PROFILE = "woocommerce"
  STORAGE_STATE_PATH = "/data/skin-script-storage.json"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[mounts]
  source = "skin_script_storage"
  destination = "/data"
